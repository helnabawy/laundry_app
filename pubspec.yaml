name: laundry_app
description: "Laundry pickup & delivery app — Customer & Driver (role-based)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.1.0
  geolocator: ^14.1.0
  get_it: ^9.2.1
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    # Display voice only: serials, fibre-content lines, stamped caps.
    # SF (the platform face) carries all body, labels and controls.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf
    - family: NotoKufiArabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic.ttf
